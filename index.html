<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question Manager Workspace</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; color: #1d1d1f; padding: 40px 20px; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 600px; }
        h2 { font-size: 28px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        .top-bar { display: flex; justify-content: flex-end; width: 100%; max-width: 600px; margin-bottom: 20px; gap: 10px; }
        .card { background-color: #ffffff; padding: 24px; border-radius: 14px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); margin-bottom: 20px; }
        .code-badge { display: inline-block; background-color: #e8e8ed; padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 13px; margin-bottom: 10px; }
        .question-text { font-size: 16px; margin-bottom: 15px; line-height: 1.4; }
        textarea, input[type="password"] { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 8px; font-size: 15px; box-sizing: border-box; outline: none; font-family: inherit; }
        textarea { resize: none; height: 70px; margin-bottom: 12px; }
        .action-row { display: flex; justify-content: space-between; gap: 10px; }
        button { padding: 10px 18px; font-size: 14px; font-weight: 500; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.2s; }
        .btn-save { background-color: #34c759; color: white; }
        .btn-save:hover { background-color: #28a745; }
        .btn-delete { background-color: #ff3b30; color: white; }
        .btn-delete:hover { background-color: #d7261b; }
        .btn-utility { background-color: #8e8e93; color: white; }
        .btn-utility:hover { background-color: #636366; }
        .btn-refresh { background-color: #0071e3; color: white; }
        .btn-refresh:hover { background-color: #0077ed; }
        .btn-primary { background-color: #0071e3; color: white; padding: 12px 20px; width: 100%; font-size: 16px; border-radius: 10px; }
        .no-data { text-align: center; color: #8e8e93; font-size: 16px; margin-top: 40px; }
        .hidden { display: none !important; }
        .login-box { background-color: #ffffff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); text-align: center; width: 100%; max-width: 360px; margin-top: 100px; }
    </style>
</head>
<body>
<div id="loginGate" class="login-box">
    <h2>Admin Login</h2>
    <p style="font-size: 14px; color: #6e6e73; margin-bottom: 20px;">Please enter your passcode.</p>
    <input type="password" id="passwordField" placeholder="Enter password" style="margin-bottom: 20px; padding: 12px;">
    <button class="btn-primary" onclick="attemptLogin()">Log In</button>
</div>
<div id="protectedDashboard" class="wrapper hidden">
    <div class="top-bar">
        <button class="btn-refresh" onclick="loadDashboard()">Refresh Feed 🔄</button>
        <button class="btn-utility" onclick="changeAdminPassword()">Change Password</button>
    </div>
    <h2>Question Board Dashboard</h2>
    <div id="boardContainer"></div>
</div>
<script>
    const CHANNEL_KEY = "robin_secure_qa_hub_v994821";
    const PROXY_URL = "https://corsproxy.io?";
    const TARGET_URL = `https://keyvalue.xyz{CHANNEL_KEY}/db`;
    const DEFAULT_PASS = "1234567";

    function attemptLogin() {
        if (document.getElementById('passwordField').value === (localStorage.getItem('admin_dashboard_pass') || DEFAULT_PASS)) {
            document.getElementById('loginGate').classList.add('hidden');
            document.getElementById('protectedDashboard').classList.remove('hidden');
            loadDashboard();
        } else {
            alert("Incorrect password.");
            document.getElementById('passwordField').value = '';
        }
    }

    function changeAdminPassword() {
        if (prompt("Enter current password:") !== (localStorage.getItem('admin_dashboard_pass') || DEFAULT_PASS)) { alert("Verification failed."); return; }
        const newPass = prompt("Enter new password:");
        if (!newPass || !newPass.trim()) { alert("Password cannot be empty."); return; }
        localStorage.setItem('admin_dashboard_pass', newPass.trim());
        alert("Password updated! Log back in.");
        document.getElementById('passwordField').value = '';
        document.getElementById('protectedDashboard').classList.add('hidden');
        document.getElementById('loginGate').classList.remove('hidden');
    }

    function loadDashboard() {
        const container = document.getElementById('boardContainer');
        container.innerHTML = '<div class="no-data">Loading synchronized board entries...</div>';

        fetch(PROXY_URL + encodeURIComponent(TARGET_URL))
        .then(res => res.status === 404 || res.status === 500 ? "{}" : res.text())
        .then(text => {
            container.innerHTML = '';
            let database = {};
            if (text && text.trim() && !text.includes("Cannot GET") && !text.includes("Error")) {
                try { database = JSON.parse(text); } catch(e) {}
            }
            if (typeof database !== 'object' || database === null || Array.isArray(database)) { database = {}; }
            let codes = Object.keys(database).reverse();

            if (codes.length === 0) {
                container.innerHTML = '<div class="no-data">No questions submitted yet.</div>';
                return;
            }

            codes.forEach(code => {
                const item = database[code];
                if (item && item.question) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="code-badge">Code: ${code}</div>
                        <div class="question-text"><strong>Q:</strong> ${item.question}</div>
                        <textarea id="ans-${code}" placeholder="Type your answer here...">${item.answer || ''}</textarea>
                        <div class="action-row">
                            <button class="btn-save" onclick="saveAnswer('${code}')">Save</button>
                            <button class="btn-delete" onclick="deleteQuestion('${code}')">Delete Question</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });

            if (container.innerHTML === '') {
                container.innerHTML = '<div class="no-data">No questions submitted yet.</div>';
            }
        })
        .catch(() => container.innerHTML = '<div class="no-data" style="color: #ff3b30;">Error downloading live feeds. Check connection.</div>');
    }

    function saveAnswer(code) {
        const ansText = document.getElementById(`ans-${code}`).value.trim();
        if (!ansText) { alert("Please type an answer."); return; }

        fetch(PROXY_URL + encodeURIComponent(TARGET_URL))
        .then(res => res.text())
        .then(text => {
            let database = {};
            try { database = JSON.parse(text); } catch(e) {}
            if (database[code]) { database[code].answer = ansText; database[code].status = "answered"; }
            
            return fetch(PROXY_URL + encodeURIComponent(TARGET_URL), {
                method: "POST",
                body: JSON.stringify(database)
            });
        })
        .then(() => { alert(`Answer saved for ${code}!`); loadDashboard(); })
        .catch(() => alert("Failed to save."));
    }

    function deleteQuestion(code) {
        if (!confirm(`Delete question ${code}?`)) return;
        fetch(PROXY_URL + encodeURIComponent(TARGET_URL))
        .then(res => res.text())
        .then(text => {
            let database = {};
            try { database = JSON.parse(text); } catch(e) {}
            delete database[code];
            
            return fetch(PROXY_URL + encodeURIComponent(TARGET_URL), {
                method: "POST",
                body: JSON.stringify(database)
            });
        })
        .then(() => loadDashboard())
        .catch(() => alert("Deletion failed."));
    }

    document.getElementById('passwordField').addEventListener('keydown', function(event) { if (event.key === 'Enter') attemptLogin(); });
</script>
</body>
</html>
